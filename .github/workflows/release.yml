name: Auto Tag Components
on:
  push:
    branches:
      - v6-dev
jobs:
  tag-components:
    runs-on: ubuntu-latest
permissions:
  contents: write
steps:
  - name: Checkout repository
    uses: actions/checkout@v3
    with:
      fetch-depth: 0
      token: ${{ secrets.GITHUB_TOKEN }}
  - name: Configure Git
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"
  - name: Create and Push Tags
    run: >
      #!/bin/bash

      set -e


      # Define components to tag (excluding root directory)

      COMPONENTS=("scsb-gateway" "scsb-auth")

      TAG_VERSION="2026.0.0"


      for component in "${COMPONENTS[@]}"; do
        TAG_NAME="${component}-${TAG_VERSION}"
        
        echo "Creating tag: $TAG_NAME"
        
        # Create annotated tag
        git tag -a "$TAG_NAME" -m "Release tag for $component version $TAG_VERSION"
        
        # Push tag to remote
        git push origin "$TAG_NAME"
        
        echo "Successfully pushed tag: $TAG_NAME"
      done
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
